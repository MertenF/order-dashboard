; Kivy settings for the Pi, installed as ~/.kivy/config.ini.
; Only the values that differ from Kivy's defaults; Kivy fills in the rest on first start.

[graphics]
; Full screen on the 1920x1080 HDMI screen, rotated to portrait
fullscreen = auto
width = 1920
height = 1080
rotation = 270
show_cursor = 0
